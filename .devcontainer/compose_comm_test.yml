services:
  coppeliasim:
    build:
      dockerfile: Dockerfile_view
    environment:
      - DISPLAY
      - ROS_DOMAIN_ID
    volumes:
      - ../../:/root/sas_tutorial_workspace/src/
      - /tmp/.X11-unix:/tmp/.X11-unix # x server related
      - ~/.Xauthority:/root/.Xauthority # x server related
    command: /bin/bash -c "
      ros2 run demo_nodes_cpp talker"

  comm_test:
    build:
      dockerfile: Dockerfile_comm_test
    environment:
      - ROS_DOMAIN_ID
    command: /bin/bash -c "
      ros2 run demo_nodes_cpp listener"


